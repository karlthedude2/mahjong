name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  web:
    name: Web + rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test game rules
        run: dotnet test Mahjong.Core.Tests --configuration Release

      - name: Test web app
        run: dotnet test web/Mahjong.Web.Tests --configuration Release

      - name: Publish web app
        run: dotnet publish web/Mahjong.Web --configuration Release --output ${{ runner.temp }}/web

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: ${{ runner.temp }}/web

  desktop:
    name: Desktop app
    # The WinForms game targets .NET Framework 4.8, which only builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild MahjongSpriteVersion/MahjongSpriteVersion.csproj -restore -p:Configuration=Release -verbosity:minimal

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: MahjongSpriteVersion/bin/Release/
